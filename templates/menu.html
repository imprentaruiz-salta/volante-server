<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>Bocado QR · Menú digital</title>
<meta name="description" content="Menú digital visual para pedir desde la mesa.">
<style>
:root{--ink:#18212b;--muted:#6e7883;--cream:#fffaf2;--paper:#fff;--orange:#f4512a;--orange2:#ff8a3d;--green:#16825b;--line:#ece7df;--shadow:0 10px 30px #18212b12}
*{box-sizing:border-box}body{margin:0;background:var(--cream);color:var(--ink);font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;padding-bottom:100px}button{font:inherit;border:0;cursor:pointer}a{color:inherit}
.top{position:sticky;top:0;z-index:20;background:#18212bf5;color:#fff;padding:15px max(18px,calc((100% - 760px)/2));backdrop-filter:blur(10px)}.topline{display:flex;align-items:center;justify-content:space-between;gap:12px}.brand{display:flex;gap:10px;align-items:center}.brandmark{background:linear-gradient(135deg,var(--orange),var(--orange2));width:43px;height:43px;border-radius:14px;display:grid;place-items:center;font-size:23px;box-shadow:0 5px 14px #f4512a55}.brand strong{display:block;font-size:18px;letter-spacing:-.4px}.brand small{display:block;color:#cbd0d5;font-size:11px;margin-top:2px}.table{background:#fff1e9;color:#ad351d;border-radius:99px;padding:9px 12px;font-weight:800;font-size:13px;white-space:nowrap}.table select{background:transparent;border:0;color:inherit;font-weight:900;font-size:13px;outline:0}
.wrap{max-width:760px;margin:auto;padding:0 16px}.hero{padding:25px 2px 14px}.hero h1{font-size:30px;line-height:1.02;margin:0 0 8px;letter-spacing:-1.1px}.hero p{margin:0;color:var(--muted);font-size:14px}.notice{display:flex;align-items:center;gap:10px;background:#fff;border:1px solid var(--line);border-radius:16px;padding:12px 14px;margin:11px 0 16px;box-shadow:0 4px 12px #18212b08;font-size:12px;color:#46505a}.notice b{color:var(--green)}
.chips{display:flex;gap:8px;overflow:auto;padding:2px 0 17px;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}.chip{background:#fff;border:1px solid var(--line);padding:9px 13px;border-radius:99px;white-space:nowrap;color:#66717b;font-weight:800;font-size:12px}.chip.active{background:var(--ink);border-color:var(--ink);color:#fff}.section-title{display:flex;justify-content:space-between;align-items:baseline;margin:6px 2px 12px}.section-title h2{font-size:20px;margin:0;letter-spacing:-.4px}.section-title span{font-size:12px;color:var(--muted)}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px}.card{background:#fff;border:1px solid var(--line);border-radius:19px;overflow:hidden;box-shadow:0 5px 18px #18212b0a;display:flex;flex-direction:column}.photo{height:145px;background:#eee;position:relative;overflow:hidden}.photo img{width:100%;height:100%;object-fit:cover;display:block}.tag{position:absolute;top:9px;left:9px;background:#fff;color:#a53b22;border-radius:99px;padding:5px 8px;font-size:10px;font-weight:900}.info{padding:12px 12px 13px;display:flex;flex-direction:column;flex:1}.info h3{font-size:16px;line-height:1.1;margin:0 0 5px}.info p{font-size:11px;line-height:1.35;color:var(--muted);margin:0 0 11px;min-height:30px}.bottom{display:flex;align-items:end;justify-content:space-between;gap:8px;margin-top:auto}.price{font-size:18px;font-weight:950;letter-spacing:-.5px}.add{width:35px;height:35px;border-radius:12px;background:var(--orange);color:#fff;font-size:24px;line-height:1;box-shadow:0 4px 10px #f4512a40}.add:active{transform:scale(.93)}
.bar{position:fixed;bottom:15px;left:50%;transform:translateX(-50%);z-index:25;width:min(728px,calc(100% - 28px));background:var(--ink);color:#fff;border-radius:20px;padding:10px 12px 10px 16px;box-shadow:0 12px 36px #18212b40;display:flex;align-items:center;justify-content:space-between;gap:12px}.bar .summary{font-size:12px;color:#cbd0d5}.bar .summary strong{display:block;color:#fff;font-size:16px;margin-top:1px}.mainbtn{background:var(--orange);color:#fff;border-radius:14px;padding:12px 15px;font-weight:900;font-size:13px;white-space:nowrap}.mainbtn:disabled{opacity:.45}.pillcount{background:#fff;color:var(--orange);border-radius:99px;padding:2px 6px;margin-left:3px}
.overlay{display:none;position:fixed;inset:0;z-index:40;background:#18212b88;align-items:flex-end;justify-content:center}.overlay.open{display:flex}.sheet{background:var(--cream);width:min(760px,100%);max-height:92vh;border-radius:25px 25px 0 0;padding:19px 16px 25px;overflow:auto;animation:up .2s ease}@keyframes up{from{transform:translateY(40px);opacity:.5}to{transform:none;opacity:1}}.sheethead{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}.sheet h2{margin:0;font-size:22px}.close{background:#ebe6de;width:34px;height:34px;border-radius:50%;font-size:21px;color:#57616a}.empty{text-align:center;color:var(--muted);padding:28px 0}.lineitem{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:15px;padding:12px;margin:8px 0}.lineitem b{font-size:14px}.lineitem small{display:block;color:var(--muted);font-size:11px;margin-top:4px}.qty{display:flex;align-items:center;gap:8px}.qty button{width:28px;height:28px;background:#f0ece5;color:var(--ink);border-radius:9px;font-weight:900}.qty span{font-weight:900;min-width:15px;text-align:center}.totals{border-top:1px dashed #d8d0c6;margin-top:14px;padding-top:13px}.totalrow{display:flex;justify-content:space-between;font-size:13px;margin:5px 0;color:#606a73}.totalrow.final{font-size:20px;font-weight:950;color:var(--ink);margin-top:10px}.actions{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:16px}.action{padding:13px;border-radius:14px;font-weight:900;font-size:13px}.action.primary{background:var(--green);color:#fff}.action.secondary{background:#eee9e1;color:var(--ink)}.action.full{grid-column:1/-1}.status{margin:12px 0 0;padding:12px 13px;border-radius:13px;background:#e9f7f0;color:#12613f;font-size:12px;line-height:1.4;display:none}.status.show{display:block}.changes{display:none;background:#fff5df;border:1px solid #f3d08c;color:#80530b;border-radius:13px;padding:11px 12px;font-size:12px;margin:10px 0}.changes.show{display:block}.print-only{display:none}
@media(max-width:480px){.hero h1{font-size:27px}.photo{height:127px}.grid{gap:10px}.info{padding:10px}.info h3{font-size:15px}.price{font-size:16px}}
@media print{body{background:#fff;padding:0}.top,.hero,.notice,.chips,.section-title,.grid,.bar,.close,.actions,.status,.changes{display:none!important}.overlay{display:flex!important;position:static;background:#fff}.sheet{max-height:none;padding:0;width:100%;border-radius:0}.print-only{display:block}.print-only h1{font-size:22px}.print-only p{font-size:12px;color:#555}.sheet .lineitem{box-shadow:none;border-color:#ddd}.sheet .qty button{display:none}.sheet .qty span:before{content:'x '}}
</style>
</head>
<body>
<header class="top"><div class="topline"><div class="brand"><div class="brandmark">🍔</div><div><strong>Bocado QR</strong><small>Pedí desde tu mesa</small></div></div><div class="table">Mesa <select id="mesa" aria-label="Número de mesa"></select></div></div></header>
<main class="wrap">
<section class="hero"><h1>¿Qué te servimos?</h1><p>Elegí mirando las fotos. Podés sumar cosas después.</p></section>
<div class="notice">📲 <span>Tu pedido queda guardado en <b>Mesa <span id="mesaLabel">1</span></b>. Revisalo antes de enviarlo.</span></div>
<nav class="chips" id="chips"></nav><div class="section-title"><h2 id="sectionName">Todo rico</h2><span id="itemCount"></span></div><section class="grid" id="products"></section>
</main>
<div class="bar"><div class="summary"><span id="barCount">0 productos</span><strong id="barTotal">$0</strong></div><button class="mainbtn" id="openCart">Ver pedido <span class="pillcount" id="count">0</span></button></div>
<div class="overlay" id="overlay"><section class="sheet"><div class="sheethead"><h2 id="sheetTitle">Tu pedido</h2><button class="close" id="close">×</button></div><div class="print-only"><h1>Bocado QR · Comanda</h1><p id="printMeta"></p></div><div class="changes" id="changes"></div><div id="cartLines"></div><div class="totals"><div class="totalrow"><span>Subtotal</span><b id="subtotal">$0</b></div><div class="totalrow"><span>Servicio</span><b>$0</b></div><div class="totalrow final"><span>Total</span><b id="total">$0</b></div></div><div class="actions"><button class="action secondary" id="print">🖨️ Imprimir ticket</button><button class="action primary" id="send">📲 Enviar pedido</button><button class="action secondary full" id="clear">Vaciar pedido</button></div><div class="status" id="status"></div></section></div>
<script>
const OWNER='5493872101274';
const products=[
{id:'hamb-clasica',cat:'Hamburguesas',name:'Clásica',desc:'Carne, lechuga, tomate y queso.',price:5200,img:'https://images.unsplash.com/photo-1568901346375-23c9450c58cd?auto=format&fit=crop&w=700&q=82',tag:'Favorita'},
{id:'hamb-cheddar',cat:'Hamburguesas',name:'Cheddar & bacon',desc:'Carne, cheddar, panceta y salsa especial.',price:6900,img:'https://images.unsplash.com/photo-1553979459-d2229ba7433b?auto=format&fit=crop&w=700&q=82',tag:'Nueva'},
{id:'pancho',cat:'Para picar',name:'Panchito completo',desc:'Salchicha, papas pay, salsas y queso.',price:3900,img:'https://images.unsplash.com/photo-1612392062631-94dd858cba88?auto=format&fit=crop&w=700&q=82'},
{id:'emp-carne',cat:'Para picar',name:'Empanada de carne',desc:'Salteña, casera y bien rellena · precio por unidad.',price:2000,img:'https://images.unsplash.com/photo-1601050690597-df0568f70950?auto=format&fit=crop&w=700&q=82',tag:'Casera'},
{id:'emp-queso',cat:'Para picar',name:'Empanada de queso',desc:'Rellena de queso fundido · precio por unidad.',price:2000,img:'https://images.unsplash.com/photo-1601050690117-94f5f6fa8bd7?auto=format&fit=crop&w=700&q=82'},
{id:'emp-pollo',cat:'Para picar',name:'Empanada de pollo',desc:'Pollo sazonado y relleno casero · precio por unidad.',price:2000,img:'https://images.unsplash.com/photo-1601050690597-df0568f70950?auto=format&fit=crop&w=700&q=82'},
{id:'limonada',cat:'Bebidas',name:'Limonada casera',desc:'Jugo natural de limón, hielo y menta · 400 ml.',price:4500,img:'https://images.unsplash.com/photo-1523677011781-c91d1bbe2f9e?auto=format&fit=crop&w=700&q=82',tag:'Natural'},
{id:'papas',cat:'Para picar',name:'Papas fritas',desc:'Porción crocante con salsa de la casa.',price:3600,img:'https://images.unsplash.com/photo-1573080496219-bb080dd4f877?auto=format&fit=crop&w=700&q=82'},
{id:'mani',cat:'Para picar',name:'Maní salado',desc:'Porción para compartir.',price:1800,img:'https://images.unsplash.com/photo-1567892737950-30c7e37d5b26?auto=format&fit=crop&w=700&q=82'},
{id:'mirinda15',cat:'Gaseosas',name:'Mirinda naranja',desc:'Botella familiar de 1,5 litros.',price:3200,img:'https://images.unsplash.com/photo-1629203849820-fdd70d49c38e?auto=format&fit=crop&w=700&q=82'},
{id:'coca15',cat:'Gaseosas',name:'Coca-Cola',desc:'Botella familiar de 1,5 litros.',price:3500,img:'https://images.unsplash.com/photo-1554866585-cd94860890b7?auto=format&fit=crop&w=700&q=82'},
{id:'fanta500',cat:'Gaseosas',name:'Fanta naranja',desc:'Botella individual de 500 ml.',price:1900,img:'https://images.unsplash.com/photo-1581636625402-29b2a704ef13?auto=format&fit=crop&w=700&q=82'},
{id:'salta',cat:'Cervezas',name:'Salta',desc:'Lata bien fría.',price:3000,img:'https://images.unsplash.com/photo-1608270586620-248524c67de9?auto=format&fit=crop&w=700&q=82'},
{id:'quilmes',cat:'Cervezas',name:'Quilmes',desc:'Lata bien fría.',price:3100,img:'https://images.unsplash.com/photo-1515003197210-e0cd71810b5f?auto=format&fit=crop&w=700&q=82'},
{id:'helado-choco',cat:'Postres',name:'Helado de chocolate',desc:'Copa individual.',price:2800,img:'https://images.unsplash.com/photo-1563805042-7684c019e1cb?auto=format&fit=crop&w=700&q=82'},
{id:'helado-dulce',cat:'Postres',name:'Helado de dulce de leche',desc:'Copa individual.',price:2800,img:'https://images.unsplash.com/photo-1570197788417-0e82375c9371?auto=format&fit=crop&w=700&q=82'}];
let mesa=new URLSearchParams(location.search).get('mesa')||localStorage.getItem('bocado-mesa')||'1';let filter='Todo';let cart=JSON.parse(localStorage.getItem('bocado-cart-'+mesa)||'{}');let sent=JSON.parse(localStorage.getItem('bocado-sent-'+mesa)||'{}');
const money=n=>'$'+Number(n||0).toLocaleString('es-AR');const byId=id=>products.find(p=>p.id===id);const total=()=>Object.entries(cart).reduce((s,[id,q])=>s+(byId(id)?.price||0)*q,0);const count=()=>Object.values(cart).reduce((a,b)=>a+b,0);
function save(){localStorage.setItem('bocado-mesa',mesa);localStorage.setItem('bocado-cart-'+mesa,JSON.stringify(cart));renderBar()}
function setMesa(v){mesa=v;cart=JSON.parse(localStorage.getItem('bocado-cart-'+mesa)||'{}');sent=JSON.parse(localStorage.getItem('bocado-sent-'+mesa)||'{}');document.getElementById('mesaLabel').textContent=mesa;render();save()}
function render(){document.getElementById('sectionName').textContent=filter==='Todo'?'Todo rico':filter;const shown=filter==='Todo'?products:products.filter(p=>p.cat===filter);document.getElementById('itemCount').textContent=shown.length+' opciones';document.getElementById('products').innerHTML=shown.map(p=>`<article class="card"><div class="photo"><img loading="lazy" src="${p.img}" alt="${p.name}">${p.tag?`<span class="tag">${p.tag}</span>`:''}</div><div class="info"><h3>${p.name}</h3><p>${p.desc}</p><div class="bottom"><span class="price">${money(p.price)}</span><button class="add" aria-label="Agregar ${p.name}" data-add="${p.id}">+</button></div></div></article>`).join('');document.querySelectorAll('[data-add]').forEach(b=>b.onclick=()=>{cart[b.dataset.add]=(cart[b.dataset.add]||0)+1;save();b.textContent='✓';setTimeout(()=>b.textContent='+',600)});renderBar()}
function renderBar(){document.getElementById('count').textContent=count();document.getElementById('barCount').textContent=count()===1?'1 producto':count()+' productos';document.getElementById('barTotal').textContent=money(total())}
function renderCart(){const lines=document.getElementById('cartLines');if(!count()){lines.innerHTML='<div class="empty">Todavía no agregaste nada.<br>Elegí algo rico del menú 😋</div>'}else{lines.innerHTML=Object.entries(cart).filter(([,q])=>q>0).map(([id,q])=>{const p=byId(id);return `<div class="lineitem"><div><b>${p.name}</b><small>${money(p.price)} c/u · ${money(p.price*q)}</small></div><div class="qty"><button data-minus="${id}">−</button><span>${q}</span><button data-plus="${id}">+</button></div></div>`}).join('');document.querySelectorAll('[data-minus]').forEach(b=>b.onclick=()=>change(b.dataset.minus,-1));document.querySelectorAll('[data-plus]').forEach(b=>b.onclick=()=>change(b.dataset.plus,1))}document.getElementById('subtotal').textContent=money(total());document.getElementById('total').textContent=money(total());document.getElementById('printMeta').textContent='Mesa '+mesa+' · '+new Date().toLocaleString('es-AR');renderChanges()}
function change(id,d){cart[id]=(cart[id]||0)+d;if(cart[id]<=0)delete cart[id];save();renderCart()}
function diff(){const old=sent||{};const all=[...new Set([...Object.keys(old),...Object.keys(cart)])];return all.map(id=>({p:byId(id),old:old[id]||0,now:cart[id]||0})).filter(x=>x.old!==x.now)}
function renderChanges(){const box=document.getElementById('changes');const d=diff();if(!Object.keys(sent||{}).length||!d.length){box.classList.remove('show');return}box.classList.add('show');box.innerHTML='<b>Hay cambios sin enviar:</b> '+d.map(x=>(x.now>x.old?'Sumar ':'Quitar ')+(x.now>x.old?x.now-x.old:x.old-x.now)+' × '+x.p.name).join(' · ');document.getElementById('send').textContent='📲 Enviar cambio'}
function msg(kind){let rows=Object.entries(cart).filter(([,q])=>q>0).map(([id,q])=>{const p=byId(id);return `${q} × ${p.name} — ${money(p.price*q)}`}).join('\n');if(kind==='change')rows=diff().map(x=>`${x.now>x.old?'AGREGAR':'QUITAR'} ${Math.abs(x.now-x.old)} × ${x.p.name}`).join('\n');return `${kind==='change'?'CAMBIO DE PEDIDO':'NUEVO PEDIDO'} · BOCADO QR\nMESA ${mesa}\n\n${rows||'Sin productos'}\n\nTOTAL ${money(total())}\n\nPor favor confirmar recepción.`}
function openCart(){document.getElementById('overlay').classList.add('open');renderCart()}
function sendOrder(){if(!count()){alert('Elegí al menos un producto.');return}const isChange=Object.keys(sent||{}).length>0;if(isChange&&!diff().length){alert('No hay cambios para enviar.');return}const text=msg(isChange?'change':'new');window.open('https://wa.me/'+OWNER+'?text='+encodeURIComponent(text),'_blank');sent={...cart};localStorage.setItem('bocado-sent-'+mesa,JSON.stringify(sent));document.getElementById('status').className='status show';document.getElementById('status').innerHTML=isChange?'✅ Cambio enviado para la Mesa '+mesa+'. Podés seguir agregando cosas.':'✅ Pedido enviado para la Mesa '+mesa+'. Si querés algo más, sumalo y mandá el cambio.';document.getElementById('send').textContent='📲 Enviar cambio';renderChanges()}
document.getElementById('mesa').innerHTML=Array.from({length:12},(_,i)=>`<option value="${i+1}">Mesa ${i+1}</option>`).join('');document.getElementById('mesa').value=mesa;document.getElementById('mesa').onchange=e=>setMesa(e.target.value);document.getElementById('openCart').onclick=openCart;document.getElementById('close').onclick=()=>document.getElementById('overlay').classList.remove('open');document.getElementById('send').onclick=sendOrder;document.getElementById('print').onclick=()=>{openCart();setTimeout(()=>window.print(),100)};document.getElementById('clear').onclick=()=>{if(confirm('¿Vaciar el pedido de esta mesa?')){cart={};save();renderCart()}};document.getElementById('overlay').onclick=e=>{if(e.target.id==='overlay')document.getElementById('overlay').classList.remove('open')};
const cats=['Todo',...new Set(products.map(p=>p.cat))];document.getElementById('chips').innerHTML=cats.map(c=>`<button class="chip ${c==='Todo'?'active':''}" data-cat="${c}">${c==='Todo'?'✨ ':''}${c}</button>`).join('');document.querySelectorAll('[data-cat]').forEach(b=>b.onclick=()=>{filter=b.dataset.cat;document.querySelectorAll('.chip').forEach(x=>x.classList.toggle('active',x===b));render()});document.getElementById('mesaLabel').textContent=mesa;render();
</script>
</body></html>
