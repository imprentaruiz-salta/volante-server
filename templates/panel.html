<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Bocado QR · Panel de pedidos</title>
<style>
:root{--ink:#18212b;--cream:#f7f4ef;--card:#fff;--muted:#71808c;--line:#e6e0d7;--orange:#f4512a;--green:#16825b;--yellow:#d88b00;--blue:#2e6fc2;--red:#b93030}*{box-sizing:border-box}body{margin:0;background:var(--cream);color:var(--ink);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif}.top{background:var(--ink);color:#fff;padding:18px max(18px,calc((100% - 1200px)/2));display:flex;align-items:center;justify-content:space-between;gap:15px}.brand{display:flex;align-items:center;gap:11px}.logo{width:43px;height:43px;border-radius:14px;display:grid;place-items:center;background:linear-gradient(135deg,#f4512a,#ff914d);font-size:23px}.brand strong{display:block;font-size:20px}.brand small{display:block;color:#c6cdd3;font-size:11px;margin-top:3px}.refresh{background:#fff1e9;color:#aa391f;border:0;border-radius:12px;padding:10px 13px;font-weight:900;cursor:pointer}.wrap{max-width:1200px;margin:auto;padding:22px 18px 35px}.intro{display:flex;justify-content:space-between;align-items:end;gap:15px;margin-bottom:18px}.intro h1{font-size:28px;letter-spacing:-.7px;margin:0 0 5px}.intro p{margin:0;color:var(--muted);font-size:13px}.live{display:flex;align-items:center;gap:7px;color:var(--green);font-size:12px;font-weight:800}.dot{width:9px;height:9px;border-radius:50%;background:#26ad72;box-shadow:0 0 0 5px #26ad7225}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:11px;margin-bottom:20px}.stat{background:var(--card);border:1px solid var(--line);border-radius:15px;padding:14px 15px}.stat b{font-size:25px;display:block}.stat span{font-size:11px;color:var(--muted);font-weight:800}.columns{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:13px;align-items:start}.column{min-width:0}.col-head{display:flex;align-items:center;justify-content:space-between;margin:0 2px 10px}.col-head h2{font-size:15px;margin:0}.badge{border-radius:99px;padding:4px 8px;font-size:11px;font-weight:900;background:#e9e4dc}.new .col-head h2{color:var(--orange)}.prep .col-head h2{color:var(--yellow)}.ready .col-head h2{color:var(--green)}.done .col-head h2{color:var(--blue)}.order{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin:0 0 11px;box-shadow:0 4px 13px #18212b08}.order.new{border-top:4px solid var(--orange)}.order.preparing{border-top:4px solid var(--yellow)}.order.listo{border-top:4px solid var(--green)}.order.entregado{border-top:4px solid var(--blue);opacity:.78}.order.cancelado{border-top:4px solid var(--red);opacity:.65}.order-top{display:flex;justify-content:space-between;gap:8px;align-items:start;margin-bottom:10px}.table{font-size:20px;font-weight:950}.time{font-size:10px;color:var(--muted);text-align:right;line-height:1.4}.items{border-top:1px dashed var(--line);padding-top:8px}.item{display:flex;justify-content:space-between;gap:8px;font-size:12px;padding:4px 0}.item b{font-size:12px}.item span{font-weight:800;white-space:nowrap}.note{background:#fff5df;color:#80530b;border-radius:10px;padding:9px 10px;font-size:11px;line-height:1.35;margin:9px 0}.total{display:flex;justify-content:space-between;border-top:1px solid var(--line);padding-top:9px;margin-top:8px;font-size:14px;font-weight:950}.type{font-size:9px;text-transform:uppercase;letter-spacing:.7px;color:var(--muted);font-weight:900;margin-bottom:5px}.actions{display:flex;gap:6px;margin-top:11px}.actions button{flex:1;border:0;border-radius:10px;padding:9px 6px;font-size:10px;font-weight:900;cursor:pointer}.next{background:var(--green);color:#fff}.back{background:#eee9e1;color:var(--ink)}.cancel{background:#fff0f0;color:var(--red)}.empty{background:#eeeae3;color:#929b9f;border-radius:14px;padding:20px 10px;text-align:center;font-size:11px}.toast{position:fixed;right:18px;bottom:18px;background:var(--ink);color:#fff;border-radius:12px;padding:12px 15px;font-size:12px;display:none;box-shadow:0 8px 24px #0003}.toast.show{display:block}@media(max-width:900px){.columns{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:560px){.top{padding:15px}.intro{display:block}.live{margin-top:12px}.stats{grid-template-columns:repeat(2,1fr)}.columns{grid-template-columns:1fr}.wrap{padding:18px 13px}.intro h1{font-size:24px}}@media print{body.printing .top,body.printing .intro,body.printing .stats,body.printing .columns .column:not(.print-column),body.printing .toast{display:none}body.printing .columns{display:block}body.printing .print-column{display:block!important}body.printing .print-column .col-head,body.printing .print-column .order:not(.print-target){display:none}body.printing .print-target{display:block!important;max-width:90mm;margin:20mm auto;border:1px solid #777;box-shadow:none}}
</style>
</head>
<body>
<header class="top"><div class="brand"><div class="logo">🍔</div><div><strong>Bocado QR</strong><small>Panel de pedidos del local</small></div></div><div style="display:flex;gap:7px;align-items:center"><a class="refresh" href="/qr-mesas" target="_blank" style="text-decoration:none">▦ QR mesas</a><button class="refresh" id="sound">🔔 Activar sonido</button><button class="refresh" id="refresh">↻ Actualizar</button></div></header>
<main class="wrap"><div class="intro"><div><h1>Comandas de hoy</h1><p>Todo ordenado por mesa y estado.</p></div><div class="live"><i class="dot"></i> Actualización automática</div></div>
<section class="stats"><div class="stat"><b id="snew">0</b><span>NUEVOS</span></div><div class="stat"><b id="spreparing">0</b><span>EN PREPARACIÓN</span></div><div class="stat"><b id="sready">0</b><span>LISTOS</span></div><div class="stat"><b id="stotal">0</b><span>TOTAL DEL DÍA</span></div></section>
<section class="columns"><div class="column new"><div class="col-head"><h2>🔴 Nuevos</h2><span class="badge" id="cnew">0</span></div><div id="new"></div></div><div class="column prep"><div class="col-head"><h2>🟠 En preparación</h2><span class="badge" id="cpreparing">0</span></div><div id="preparing"></div></div><div class="column ready"><div class="col-head"><h2>🟢 Listos</h2><span class="badge" id="clisto">0</span></div><div id="listo"></div></div><div class="column done"><div class="col-head"><h2>🔵 Entregados</h2><span class="badge" id="centregado">0</span></div><div id="entregado"></div></div></section></main><div class="toast" id="toast"></div>
<script>
const money=n=>'$'+Number(n||0).toLocaleString('es-AR');
const labels={nuevo:'NUEVO PEDIDO',preparando:'EN PREPARACIÓN',listo:'LISTO',entregado:'ENTREGADO',cancelado:'CANCELADO'};
let orders=[];let previousNew=0;let soundOn=false;
function beep(){if(!soundOn)return;try{const c=new (window.AudioContext||window.webkitAudioContext)(),o=c.createOscillator(),g=c.createGain();o.frequency.value=740;g.gain.value=.08;o.connect(g);g.connect(c.destination);o.start();o.stop(c.currentTime+.18)}catch(e){}}
async function load(){try{const r=await fetch('/api/pedidos');const incoming=await r.json();const nuevos=incoming.filter(o=>o.estado==='nuevo').length;if(nuevos>previousNew)beep();previousNew=nuevos;orders=incoming;render()}catch(e){show('No se pudieron cargar los pedidos')}}
function show(text){const t=document.getElementById('toast');t.textContent=text;t.className='toast show';setTimeout(()=>t.className='toast',2800)}
function formatTime(v){try{return new Date(v.replace(' ','T')).toLocaleTimeString('es-AR',{hour:'2-digit',minute:'2-digit'})}catch(e){return v}}
function card(o){const items=Array.isArray(o.items)?o.items:[];const rows=items.map(i=>`<div class="item"><b>${i.qty||i.cantidad||1} × ${i.name||i.nombre||'Producto'}</b><span>${money(i.subtotal||i.total||0)}</span></div>`).join('');const next=o.estado==='nuevo'?'preparando':o.estado==='preparando'?'listo':o.estado==='listo'?'entregado':null;const nextText=o.estado==='nuevo'?'Aceptar y preparar':o.estado==='preparando'?'Marcar listo':o.estado==='listo'?'Marcar entregado':'';return `<article class="order ${o.estado}" data-id="${o.id}"><div class="order-top"><div><div class="type">${o.tipo==='change'?'CAMBIO DE PEDIDO':labels[o.estado]||'PEDIDO'}</div><div class="table">Mesa ${o.mesa}</div></div><div class="time">#${o.id}<br>${formatTime(o.creado)}</div></div><div class="items">${rows||'<div class="item">Sin detalle</div>'}</div>${o.observaciones?`<div class="note">📝 ${o.observaciones}</div>`:''}<div class="total"><span>Total</span><span>${money(o.total)}</span></div><div class="actions">${next?`<button class="next" data-id="${o.id}" data-state="${next}">${nextText}</button>`:''}${o.estado==='nuevo'||o.estado==='preparando'?`<button class="cancel" data-id="${o.id}" data-state="cancelado">Cancelar</button>`:''}${o.estado==='entregado'?`<button class="back" data-id="${o.id}" data-state="nuevo">Reabrir</button>`:''}<button class="back" data-print="${o.id}">🖨️ Imprimir</button></div></article>`}
function render(){const groups={nuevo:[],preparando:[],listo:[],entregado:[]};orders.forEach(o=>{if(groups[o.estado])groups[o.estado].push(o)});['nuevo','preparando','listo','entregado'].forEach(k=>{document.getElementById(k).innerHTML=groups[k].length?groups[k].map(card).join(''):'<div class="empty">Sin pedidos</div>';document.getElementById('c'+k).textContent=groups[k].length});document.getElementById('snew').textContent=groups.nuevo.length;document.getElementById('spreparing').textContent=groups.preparando.length;document.getElementById('sready').textContent=groups.listo.length;document.getElementById('stotal').textContent=orders.length;document.querySelectorAll('[data-state]').forEach(b=>b.onclick=()=>update(b.dataset.id,b.dataset.state));document.querySelectorAll('[data-print]').forEach(b=>b.onclick=()=>printOrder(b.dataset.print))}
function printOrder(id){document.body.classList.add('printing');document.querySelectorAll('.order').forEach(x=>x.classList.toggle('print-target',x.dataset.id===String(id)));window.print();setTimeout(()=>{document.body.classList.remove('printing');document.querySelectorAll('.print-target').forEach(x=>x.classList.remove('print-target'))},500)}
async function update(id,state){const r=await fetch('/api/pedidos/'+id,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({estado:state})});if(r.ok){show('Pedido actualizado');load()}else show('No se pudo actualizar')}
document.getElementById('sound').onclick=()=>{soundOn=!soundOn;document.getElementById('sound').textContent=soundOn?'🔔 Sonido activo':'🔕 Activar sonido';if(soundOn)beep()};document.getElementById('refresh').onclick=load;load();setInterval(load,5000);
</script></body></html>
